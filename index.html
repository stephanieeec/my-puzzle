<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>星球拼圖・太空配對</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Microsoft JhengHei",sans-serif;color:#f5f7ff;background:#070b24;font-size:22px}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 15% 15%,#25306880,transparent 55%),radial-gradient(ellipse at 90% 65%,#47266870,transparent 50%),#070b24}
button{font:inherit;cursor:pointer}button:focus-visible{outline:4px solid #fff;outline-offset:5px}.stars{position:fixed;inset:0;pointer-events:none;overflow:hidden}.star{position:absolute;background:#fff;border-radius:50%;animation:twinkle 4s infinite alternate}@keyframes twinkle{from{opacity:.18}to{opacity:.85}}
main{position:relative;max-width:1200px;margin:auto;padding:36px 24px 40px}header{display:flex;justify-content:space-between;align-items:center;gap:24px}.eyebrow{color:#b9caff;font-size:20px;letter-spacing:3px}h1{font-size:clamp(34px,5vw,52px);margin:8px 0}p{line-height:1.6;margin:10px 0;color:#dbe3ff}.controls{display:flex;gap:12px;flex-wrap:wrap}.button{background:#e1ebff;color:#111a3d;border:0;border-radius:16px;padding:16px 22px;min-height:60px;font-weight:700}.secondary{background:#182644;color:#fff;border:2px solid #8698c5}
.statusbar{display:flex;gap:20px;align-items:center;margin:26px 0 18px;flex-wrap:wrap}.progress{background:#253457;border:1px solid #8aa0d1;padding:12px 20px;border-radius:99px;font-weight:700}#status{flex:1;min-width:220px;color:#fff;font-weight:650;min-height:36px}.panel{border:1px solid #5c6b9c;border-radius:28px;padding:24px;background:#101932bf;box-shadow:0 20px 60px #0003}h2{font-size:24px;margin:0 0 22px}.targets{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}.hole{min-height:185px;border:2px dashed #93a5d0;border-radius:24px;display:flex;align-items:center;justify-content:center;flex-direction:column;position:relative;background:#060d25;transition:box-shadow .2s,border-color .2s}.hole svg{width:115px;height:115px;overflow:visible}.hole span{color:#d4def9;font-size:20px;margin-top:8px}.dragging .hole:not(.filled){border-color:#a1eaff;box-shadow:0 0 24px #68d9ff60,inset 0 0 24px #68d9ff20}.hole.near:not(.filled){border-color:#fff;box-shadow:0 0 35px #a1eaffaa}.hole.filled{border:2px solid #98efbb;background:#133327}.hole.filled span{color:#bafbd1}.tray{margin-top:24px}.pieces{display:grid;grid-template-columns:repeat(8,1fr);gap:12px}.slot{min-width:0;min-height:160px;border-radius:20px;background:#1b2542;border:1px solid #53618a;display:flex;align-items:center;justify-content:center}.piece{border:none;background:none;padding:10px;width:100%;min-height:150px;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff}.piece svg{width:105px;height:105px;overflow:visible;filter:drop-shadow(0 8px 10px #0007)}.piece span{font-size:20px;margin-top:7px;white-space:nowrap}.piece.selected{outline:3px solid #b6efff;border-radius:16px;background:#365080}.piece.moving{position:fixed;width:145px;height:155px;min-height:0;z-index:20;pointer-events:none;cursor:grabbing;filter:drop-shadow(0 10px 18px #0009)}.slot.done{color:#bafbd1;font-size:20px}.help{font-size:20px;text-align:center;margin:22px 0 0}.completion{position:fixed;inset:0;z-index:30;background:#03071bdd;display:flex;align-items:center;justify-content:center;padding:24px}.completion[hidden]{display:none}.card{text-align:center;max-width:560px;border:2px solid #a8d9ff;border-radius:32px;padding:40px;background:linear-gradient(135deg,#203b65,#291b50);box-shadow:0 0 80px #679cff40}.celebrate{font-size:72px}.card h2{font-size:36px;margin:16px 0}.card p{margin-bottom:28px}
@media(max-width:950px){.pieces{grid-template-columns:repeat(4,1fr)}.targets{grid-template-columns:repeat(3,1fr)}header{align-items:flex-start;flex-direction:column}.hole{min-height:170px}}
@media(max-width:520px){main{padding:24px 14px}.panel{padding:18px 12px}.targets{grid-template-columns:repeat(2,1fr);gap:12px}.pieces{grid-template-columns:repeat(2,1fr)}.hole{min-height:160px}.controls{width:100%}.button{padding:14px 18px}.statusbar{gap:12px}.card{padding:28px 18px}}
@media(prefers-reduced-motion:reduce){.star{animation:none}.hole{transition:none}}
</style>
</head>
<body>
<div class="stars" aria-hidden="true" id="stars"></div>
<main>
<header><div><div class="eyebrow">SPACE PUZZLE · 太空探索</div><h1>讓星球找到自己的家</h1><p>把彩色星球拖進相同形狀的洞裡。<br>找對 5 個，就完成任務！</p></div><div class="controls"><button class="button secondary" id="sound" aria-pressed="true">音效：開啟</button><button class="button" id="reset">↻ 重新開始</button></div></header>
<div class="statusbar"><div class="progress" id="progress">已完成 0 / 5</div><div id="status" role="status" aria-live="polite" aria-atomic="true">慢慢來，選一顆星球開始吧。</div></div>
<section class="panel" aria-labelledby="target-title"><h2 id="target-title">① 星球的家 · 找相同的形狀</h2><div class="targets" id="targets"></div></section>
<section class="panel tray" aria-labelledby="piece-title"><h2 id="piece-title">② 拖曳星球 · 有 3 顆沒有對應的家</h2><div class="pieces" id="pieces"></div></section>
<p class="help">手指或滑鼠都可以拖。也可以先點星球，再點洞來配對。<br>不用放得很準，拖到洞附近就可以了。</p>
</main>
<div class="completion" id="completion" hidden role="dialog" aria-modal="true" aria-labelledby="complete-title"><div class="card"><div class="celebrate" aria-hidden="true">🪐 ✨</div><h2 id="complete-title">太棒了，任務完成！</h2><p>5 顆星球都找到自己的家了。<br>謝謝你，太空探險家！</p><button class="button" id="again">再玩一次</button></div></div>
<script>
'use strict';
const shapes=[
{id:'clover',name:'四葉草',color:'#82e8af',dark:'#26816b',path:'M60 29 C35 -4 0 26 29 60 C-4 85 26 120 60 91 C85 124 120 94 91 60 C124 35 94 0 60 29Z'},
{id:'star',name:'四角星',color:'#ffd87d',dark:'#b56b28',path:'M60 7 L75 45 L113 60 L75 75 L60 113 L45 75 L7 60 L45 45Z'},
{id:'arch',name:'拱門',color:'#ffa6c2',dark:'#ac477c',path:'M20 108 L20 48 C20 -7 100 -7 100 48 L100 108 L75 108 L75 52 C75 30 45 30 45 52 L45 108Z'},
{id:'blob',name:'圓塊',color:'#b7a5ff',dark:'#6551ba',path:'M55 10 C76 3 90 22 101 39 C120 64 103 80 93 98 C77 118 61 100 42 107 C17 113 6 91 14 70 C-2 45 22 11 55 10Z'},
{id:'cross',name:'十字',color:'#87ddff',dark:'#277ba8',path:'M43 10 L77 10 L77 43 L110 43 L110 77 L77 77 L77 110 L43 110 L43 77 L10 77 L10 43 L43 43Z'},
{id:'trapezoid',name:'斜梯形',color:'#ffaf7c',dark:'#b95635',path:'M42 18 L112 18 L81 102 L9 102Z'},
{id:'peanut',name:'花生形',color:'#e6adf4',dark:'#974caf',path:'M60 32 C28 -10 0 21 12 54 C19 71 18 80 32 100 C50 124 84 113 77 84 C76 72 106 79 111 52 C120 14 80 -6 60 32Z'},
{id:'hexagon',name:'六角形',color:'#d3df87',dark:'#7a8a30',path:'M33 12 L87 12 L114 60 L87 108 L33 108 L6 60Z'}];
const $=id=>document.getElementById(id);let matched=new Set(),selected=null,drag=null,soundOn=true,audio=null,serial=0;
function shuffle(items){const a=[...items];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function svg(shape,hole=false){const key='paint'+(++serial);return `<svg viewBox="0 0 120 120" aria-hidden="true"><defs><radialGradient id="${key}" cx="30%" cy="25%" r="85%"><stop offset="0" stop-color="${shape.color}"/><stop offset="1" stop-color="${shape.dark}"/></radialGradient><clipPath id="clip${key}"><path d="${shape.path}"/></clipPath></defs><path d="${shape.path}" fill="${hole?'#253553':`url(#${key})`}" stroke="${hole?'#c3d4f5':shape.color}" stroke-width="3" ${hole?'stroke-dasharray="5 5"':''}/>${hole?'':`<g clip-path="url(#clip${key})" fill="none" stroke="#ffffff" stroke-opacity=".23" stroke-width="5"><path d="M-10 70 Q50 40 135 75"/><path d="M-10 87 Q60 57 135 94"/></g><ellipse cx="42" cy="31" rx="10" ry="6" fill="#fff" opacity=".35" clip-path="url(#clip${key})"/>`}</svg>`}
function say(message){$('status').textContent=message}
function unlockAudio(){if(!soundOn)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume().catch(()=>{})}catch(e){}}
function tone(correct){if(!soundOn||!audio)return;try{const notes=correct?[523,659,784]:[220,165];notes.forEach((freq,i)=>{const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime+i*.14;o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.14,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.19);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+.2)})}catch(e){}}
function clearSelection(){document.querySelectorAll('.selected').forEach(el=>el.classList.remove('selected'));selected=null;document.body.classList.remove('dragging')}
function choose(id){clearSelection();selected=id;document.querySelector(`.piece[data-id="${id}"]`)?.classList.add('selected');document.body.classList.add('dragging');say(`已選擇${shapes.find(s=>s.id===id).name}，請點相同形狀的洞。`)}
function match(id,hole){const shape=shapes.find(s=>s.id===id);clearSelection();if(hole&&!matched.has(hole.dataset.id)&&hole.dataset.id===id){matched.add(id);hole.classList.add('filled');hole.innerHTML=svg(shape)+'<span>✓ 配對成功</span>';hole.setAttribute('aria-label',shape.name+'，已配對');const piece=document.querySelector(`.piece[data-id="${id}"]`);piece.parentElement.classList.add('done');piece.parentElement.innerHTML='✓ 已找到家';$('progress').textContent=`已完成 ${matched.size} / 5`;say(`配對正確！${shape.name}找到家了。`);tone(true);if(matched.size===5){$('completion').hidden=false;$('again').focus()}}else{say(hole?'形狀不一樣，星球回來了。再試一次！':'還沒放進空洞，星球回來了。再試一次！');tone(false)}}
function nearest(x,y){let best=null,distance=Infinity;document.querySelectorAll('.hole:not(.filled)').forEach(h=>{const r=h.getBoundingClientRect(),dx=Math.max(Math.abs(x-(r.left+r.width/2))-r.width/2,0),dy=Math.max(Math.abs(y-(r.top+r.height/2))-r.height/2,0),d=Math.hypot(dx,dy);if(d<=38&&d<distance){best=h;distance=d}});return best}
function move(e){if(!drag||e.pointerId!==drag.pointerId)return;const dx=e.clientX-drag.startX,dy=e.clientY-drag.startY;if(!drag.moved&&Math.hypot(dx,dy)>7){drag.moved=true;clearSelection();document.body.classList.add('dragging');drag.el.classList.add('moving');drag.el.style.width=drag.width+'px';drag.el.style.height=drag.height+'px'}if(!drag.moved)return;e.preventDefault();const left=e.clientX-drag.offsetX,top=e.clientY-drag.offsetY;drag.el.style.left=left+'px';drag.el.style.top=top+'px';document.querySelectorAll('.near').forEach(h=>h.classList.remove('near'));nearest(left+drag.width/2,top+drag.height/2)?.classList.add('near')}
function finish(e,cancelled=false){if(!drag||e.pointerId!==drag.pointerId)return;const d=drag;let hole=null;if(d.moved&&!cancelled){const r=d.el.getBoundingClientRect();hole=nearest(r.left+r.width/2,r.top+r.height/2)}drag=null;if(d.el.hasPointerCapture(d.pointerId))d.el.releasePointerCapture(d.pointerId);d.el.classList.remove('moving');d.el.removeAttribute('style');document.querySelectorAll('.near').forEach(h=>h.classList.remove('near'));document.body.classList.remove('dragging');if(cancelled){clearSelection();say('拖曳已取消，請再試一次。')}else if(d.moved){match(d.id,hole)}else{choose(d.id)}d.el.dataset.ignoreClick='true';setTimeout(()=>delete d.el.dataset.ignoreClick,0)}
function startGame(){if(drag){const d=drag;finish({pointerId:d.pointerId},true)}clearSelection();matched=new Set();$('completion').hidden=true;$('progress').textContent='已完成 0 / 5';say('慢慢來，選一顆星球開始吧。');$('targets').innerHTML='';$('pieces').innerHTML='';shuffle(shapes.slice(0,5)).forEach(s=>{const h=document.createElement('button');h.type='button';h.className='hole';h.dataset.id=s.id;h.setAttribute('aria-label',s.name+'的洞');h.innerHTML=svg(s,true)+`<span>${s.name}</span>`;h.addEventListener('click',()=>{unlockAudio();if(matched.has(s.id)){say('這個洞已經配對完成了。');return}if(selected)match(selected,h);else say('請先選擇一顆星球，再點這個洞。')});$('targets').append(h)});shuffle(shapes).forEach(s=>{const slot=document.createElement('div');slot.className='slot';const p=document.createElement('button');p.type='button';p.className='piece';p.dataset.id=s.id;p.setAttribute('aria-label',s.name+'星球，拖到相同形狀的洞，或點選後再點洞');p.innerHTML=svg(s)+`<span>${s.name}</span>`;p.addEventListener('pointerdown',e=>{if(drag||e.button!==0)return;unlockAudio();const r=p.getBoundingClientRect();drag={el:p,id:s.id,pointerId:e.pointerId,startX:e.clientX,startY:e.clientY,offsetX:e.clientX-r.left,offsetY:e.clientY-r.top,width:r.width,height:r.height,moved:false};p.setPointerCapture(e.pointerId)});p.addEventListener('pointermove',move);p.addEventListener('pointerup',e=>finish(e));p.addEventListener('pointercancel',e=>finish(e,true));p.addEventListener('lostpointercapture',e=>{if(drag&&drag.pointerId===e.pointerId)finish(e,true)});p.addEventListener('click',()=>{if(p.dataset.ignoreClick)return;unlockAudio();choose(s.id)});slot.append(p);$('pieces').append(slot)})}
$('reset').addEventListener('click',()=>{unlockAudio();startGame()});$('again').addEventListener('click',()=>{startGame();$('reset').focus()});$('sound').addEventListener('click',()=>{soundOn=!soundOn;$('sound').textContent='音效：'+(soundOn?'開啟':'關閉');$('sound').setAttribute('aria-pressed',String(soundOn));if(soundOn)unlockAudio()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&selected){clearSelection();say('已取消選擇，請選一顆星球。')}if(!$('completion').hidden&&e.key==='Tab'){e.preventDefault();$('again').focus()}});window.addEventListener('blur',()=>{if(drag)finish({pointerId:drag.pointerId},true)});
for(let i=0;i<85;i++){const star=document.createElement('i');star.className='star';const size=Math.random()*2+1;star.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;width:${size}px;height:${size}px;animation-delay:-${Math.random()*5}s;animation-duration:${3+Math.random()*4}s`;$('stars').append(star)}startGame();
</script>
</body>
</html>
